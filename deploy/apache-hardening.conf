# Prisma — endurecimiento de Apache.
#
# El webroot es el checkout completo del repo (montado como volumen), así que
# hay que bloquear explícitamente todo lo que no son páginas públicas.
# Esta conf va horneada en la imagen (Dockerfile.web) para sobrevivir a
# recreaciones del contenedor. Motivo: en jul-2026 /.env se servía en
# producción con las claves dentro.

# Dotfiles: .env, .git, .claude, .gitignore...
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/var/www/html/\.">
    Require all denied
</DirectoryMatch>

# Directorios internos: BD y datos, logs, documentación, librerías,
# artefactos del pipeline y ficheros de despliegue.
<DirectoryMatch "^/var/www/html/(data|logs|docs|lib|rechazados|output|deploy)">
    Require all denied
</DirectoryMatch>

# Extensiones que nunca son contenido web en este proyecto.
<FilesMatch "\.(md|db|db-wal|db-shm|sqlite|log|bak)$">
    Require all denied
</FilesMatch>
